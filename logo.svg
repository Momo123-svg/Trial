<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Map pin background -->
  <path d="M200 50 C250 50, 300 100, 300 150 C300 200, 200 350, 200 350 C200 350, 100 200, 100 150 C100 100, 150 50, 200 50 Z" fill="#2d5a4a" stroke="#ffffff" stroke-width="8"/>
  
  <!-- Inner circle -->
  <circle cx="200" cy="150" r="80" fill="#ffffff"/>
  
  <!-- Factory building -->
  <g transform="translate(130, 100)">
    <!-- Main building -->
    <rect x="0" y="30" width="40" height="50" fill="#c67c3b"/>
    <rect x="45" y="20" width="35" height="60" fill="#b8672f"/>
    <rect x="85" y="35" width="30" height="45" fill="#c67c3b"/>
    
    <!-- Windows -->
    <rect x="5" y="40" width="8" height="8" fill="#8b4513"/>
    <rect x="17" y="40" width="8" height="8" fill="#8b4513"/>
    <rect x="27" y="40" width="8" height="8" fill="#8b4513"/>
    <rect x="5" y="55" width="8" height="8" fill="#8b4513"/>
    <rect x="17" y="55" width="8" height="8" fill="#8b4513"/>
    <rect x="27" y="55" width="8" height="8" fill="#8b4513"/>
    
    <rect x="50" y="30" width="8" height="8" fill="#8b4513"/>
    <rect x="62" y="30" width="8" height="8" fill="#8b4513"/>
    <rect x="50" y="45" width="8" height="8" fill="#8b4513"/>
    <rect x="62" y="45" width="8" height="8" fill="#8b4513"/>
    <rect x="50" y="60" width="8" height="8" fill="#8b4513"/>
    <rect x="62" y="60" width="8" height="8" fill="#8b4513"/>
    
    <rect x="90" y="45" width="8" height="8" fill="#8b4513"/>
    <rect x="102" y="45" width="8" height="8" fill="#8b4513"/>
    <rect x="90" y="60" width="8" height="8" fill="#8b4513"/>
    <rect x="102" y="60" width="8" height="8" fill="#8b4513"/>
    
    <!-- Chimneys -->
    <rect x="10" y="10" width="8" height="25" fill="#c67c3b"/>
    <rect x="25" y="5" width="8" height="30" fill="#c67c3b"/>
    <rect x="95" y="15" width="8" height="25" fill="#c67c3b"/>
  </g>
  
  <!-- Large pollution cloud -->
  <g transform="translate(140, 60)">
    <circle cx="0" cy="0" r="12" fill="#a67c52"/>
    <circle cx="15" cy="-5" r="15" fill="#a67c52"/>
    <circle cx="30" cy="-3" r="13" fill="#a67c52"/>
    <circle cx="45" cy="-8" r="11" fill="#a67c52"/>
    <circle cx="55" cy="2" r="9" fill="#a67c52"/>
    <circle cx="40" cy="8" r="14" fill="#a67c52"/>
    <circle cx="20" cy="10" r="12" fill="#a67c52"/>
    <circle cx="5" cy="8" r="10" fill="#a67c52"/>
  </g>
  
  <!-- Small pollution cloud -->
  <g transform="translate(250, 80)">
    <circle cx="0" cy="0" r="8" fill="#a67c52"/>
    <circle cx="12" cy="-3" r="10" fill="#a67c52"/>
    <circle cx="22" cy="-1" r="8" fill="#a67c52"/>
    <circle cx="28" cy="5" r="6" fill="#a67c52"/>
    <circle cx="18" cy="8" r="9" fill="#a67c52"/>
    <circle cx="5" cy="6" r="7" fill="#a67c52"/>
  </g>
  
  <!-- Company name -->
  <text x="200" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#2d5a4a">AtmosSense</text>
  
  <!-- Tagline -->
  <text x="200" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#c67c3b">REAL-TIME POLLUTION MAPPING</text>
</svg>